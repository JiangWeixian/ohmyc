name: Snapshot Release
on:
  push:
    paths:
      - ".changeset/**"
    branches:
      - snapshot
  pull_request:
    paths:
      - ".changeset/**"
    branches: [master, main, release]
env:
  CI: true
jobs:
  snapshot-release:
    # Only repo owner can publish snapshot version when create pr target master
    if: ${{ github.triggering_actor == github.repository_owner }}
    runs-on: ubuntu-latest
    steps:
      - name: checkout code repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: setup node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: oven-sh/setup-bun@v1
        name: Install bun
        id: bun-install
        with:
          bun-version: latest
      - uses: actions/cache@v3
        name: setup bun cache
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-store-${{ hashFiles('**/bun.lockb') }}
          restore-keys: |
            ${{ runner.os }}-bun-store-
      - name: install dependencies
        run: bun install
      - name: Creating .npmrc
        run: |
          cat << EOF > "$HOME/.npmrc"
            //registry.npmjs.org/:_authToken=$NPM_TOKEN
          EOF
        env:
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
      # enable it if develop swc plugin
      # - name: install Rust
      #   uses: actions-rs/toolchain@v1
      #   with:
      #     profile: minimal
      # - name: install wasm target
      #   shell: bash
      #   run: |
      #     rustup target add wasm32-wasi
      - name: create and publish versions
        run: |
          bun ci:snapshot
          bun changeset pre enter snapshot
          bun ci:prerelease
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}

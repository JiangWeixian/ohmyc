name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.2.0)
        required: true
        type: string

jobs:
  build:
    strategy:
      matrix:
        platform: [macos-14, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile=false

      - name: Validate desktop release version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          VERSION="$VERSION" node - <<'NODE'
          const fs = require('node:fs')
          const expected = process.env.VERSION
          const packageJson = JSON.parse(fs.readFileSync('packages/desktop/package.json', 'utf8'))
          const tauriConfig = JSON.parse(fs.readFileSync('packages/desktop/src-tauri/tauri.conf.json', 'utf8'))
          const cargoToml = fs.readFileSync('packages/desktop/src-tauri/Cargo.toml', 'utf8')
          const cargoVersion = cargoToml.match(/^version = "([^"]+)"/m)?.[1]
          const versions = {
            'packages/desktop/package.json': packageJson.version,
            'packages/desktop/src-tauri/tauri.conf.json': tauriConfig.version,
            'packages/desktop/src-tauri/Cargo.toml': cargoVersion,
          }
          const mismatches = Object.entries(versions).filter(([, version]) => version !== expected)
          if (mismatches.length > 0) {
            console.error(`Release tag ${process.env.RELEASE_TAG} resolves to ${expected}, but committed desktop versions differ:`)
            for (const [file, version] of mismatches) {
              console.error(`- ${file}: ${version ?? 'missing'}`)
            }
            console.error('Commit the desktop version bump before dispatching Build Desktop App.')
            process.exit(1)
          }
          console.log(`Desktop release version ${expected} matches committed project versions.`)
          NODE

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Build workspace dependencies
        run: pnpm --filter '@ohmyc/desktop...' build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "OhMyC ${{ inputs.tag }}"
          releaseDraft: true
          prerelease: false
          projectPath: packages/desktop
          tauriScript: pnpm tauri

name: Build Desktop App

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag (e.g. v0.2.0)
        required: true
        type: string
      release_kind:
        description: Draft builds use the selected branch; official releases build from the tag.
        required: true
        default: draft
        type: choice
        options:
          - draft
          - official

jobs:
  build:
    strategy:
      matrix:
        platform: [macos-14, windows-latest]
    runs-on: ${{ matrix.platform }}
    env:
      NODE_OPTIONS: --max-old-space-size=4096
    permissions:
      contents: write
    steps:
      - name: Checkout selected ref
        if: ${{ inputs.release_kind == 'draft' }}
        uses: actions/checkout@v5

      - name: Checkout release tag
        if: ${{ inputs.release_kind == 'official' }}
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: pnpm/action-setup@v4
        with:
          run_install: false

      - uses: actions/setup-node@v5
        with:
          node-version: 22

      - name: Get pnpm store directory
        shell: bash
        run: echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: ${{ runner.os }}-pnpm-store-

      - run: pnpm install --frozen-lockfile=false

      - name: Set desktop bundle version
        shell: bash
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          VERSION="${RELEASE_TAG#v}"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+([-.+][0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG"
            exit 1
          fi
          VERSION="$VERSION" node - <<'NODE'
          const fs = require('node:fs')
          const inputVersion = process.env.VERSION
          const configPath = 'packages/desktop/src-tauri/tauri.conf.json'
          const config = JSON.parse(fs.readFileSync(configPath, 'utf8'))
          let bundleVersion = inputVersion
          if (process.env.RUNNER_OS === 'Windows' && inputVersion.includes('-')) {
            const [core, prereleaseAndMetadata] = inputVersion.split('-', 2)
            const prerelease = prereleaseAndMetadata.split('+', 1)[0]
            const numericIdentifier = prerelease.match(/(?:^|[.-])(\d+)(?:$|[.-])/)?.[1]
            if (!numericIdentifier) {
              console.error(`Windows MSI requires numeric prerelease identifiers, but ${inputVersion} has none.`)
              process.exit(1)
            }
            const numericValue = Number(numericIdentifier)
            if (!Number.isInteger(numericValue) || numericValue > 65535) {
              console.error(`Windows MSI prerelease identifier must be an integer <= 65535, got ${numericIdentifier}.`)
              process.exit(1)
            }
            bundleVersion = `${core}-${numericIdentifier}`
            console.log(`Windows MSI bundle version normalized from ${inputVersion} to ${bundleVersion}.`)
          }
          config.version = bundleVersion
          fs.writeFileSync(configPath, `${JSON.stringify(config, null, 2)}\n`)
          console.log(`Desktop bundle version set to ${config.version}`)
          NODE

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri

      - name: Build workspace dependencies
        run: pnpm --filter '@ohmyc/desktop...' build

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ inputs.tag }}
          releaseName: "OhMyC ${{ inputs.tag }}"
          releaseDraft: ${{ inputs.release_kind == 'draft' }}
          prerelease: ${{ contains(inputs.tag, '-') }}
          projectPath: packages/desktop
          tauriScript: pnpm tauri

name: Node.js CI

on:
  push:
  pull_request:
    branches: [master, release]

jobs:
  test:
    runs-on: ubuntu-latest
    name: test
    env:
      CI: true
      NODE_OPTIONS: --max-old-space-size=4096

    strategy:
      matrix:
        node-version: [22.x]

    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout code repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        name: Install pnpm
        id: pnpm-install
        with:
          run_install: false
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node-version }}
      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV
      - uses: actions/cache@v4
        name: Setup pnpm cache
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-
      - name: Install
        run: |
          pnpm install --frozen-lockfile=false
      - uses: oven-sh/setup-bun@v2
        name: Install bun
        with:
          bun-version: 1.3.12
      - name: Build
        run: pnpm build
      - name: Test
        run: |
          pnpm -r test:coverage

      - name: Report Coverage (timeline)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: timeline
          working-directory: packages/timeline

      - name: Report Coverage (ui)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: ui
          working-directory: packages/ui

      - name: Report Coverage (cli)
        if: always()
        uses: davelosert/vitest-coverage-report-action@v2
        with:
          name: cli
          working-directory: packages/cli

      - name: Install Playwright browsers
        run: pnpm --filter @ohmyc/ui exec playwright install --with-deps chromium

      - name: Test Storybook
        run: pnpm --filter @ohmyc/ui exec vitest --project=storybook --run

  desktop-test:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v5
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: packages/desktop/src-tauri
      - name: Run Rust unit tests
        run: cargo test --manifest-path packages/desktop/src-tauri/Cargo.toml

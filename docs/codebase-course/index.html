<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>OhMyC — Codebase Course</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Geist+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/mermaid@11.4.1/dist/mermaid.min.js"></script>
<style>
/* _base.css — shared across essay and index pages.
   Design tokens, resets, typography, hero, prereq chips, container, footer, badges. */

:root {
  --bg: #07080a;
  --surface: #101111;
  --surface-2: #161718;
  --border: hsl(195, 5%, 15%);
  --border-soft: hsl(195, 5%, 12%);
  --text: #f9f9f9;
  --text-dim: #9c9c9d;
  --text-faint: #6b6b6c;
  --accent: #FF6363;
  --accent-soft: rgba(255, 99, 99, 0.12);
  --code-bg: #0c0d0f;
  --highlight: rgba(255, 99, 99, 0.10);
  --scrollbar-size: 10px;
  --scrollbar-track: rgba(255, 255, 255, 0.035);
  --scrollbar-thumb: rgba(156, 156, 157, 0.42);
  --scrollbar-thumb-hover: rgba(249, 249, 249, 0.58);
  --shadow-card:
    0 1px 0 rgba(255,255,255,0.04) inset,
    0 0 0 1px rgba(255,255,255,0.02),
    0 8px 24px rgba(0,0,0,0.35),
    0 2px 6px rgba(0,0,0,0.25);
  --shadow-pill:
    0 1px 0 rgba(255,255,255,0.10) inset,
    0 4px 12px rgba(255, 99, 99, 0.25),
    0 2px 4px rgba(0,0,0,0.4);
  --font-primary: 'Inter', -apple-system, BlinkMacSystemFont, system-ui, sans-serif;
  --font-mono: 'Geist Mono', ui-monospace, SFMono-Regular, Menlo, Monaco, monospace;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
*, *::before, *::after { box-sizing: border-box; }
* {
  scrollbar-color: var(--scrollbar-thumb) var(--scrollbar-track);
  scrollbar-width: thin;
}
*::-webkit-scrollbar {
  width: var(--scrollbar-size);
  height: var(--scrollbar-size);
}
*::-webkit-scrollbar-track {
  background: var(--scrollbar-track);
  border-radius: 999px;
}
*::-webkit-scrollbar-thumb {
  background: var(--scrollbar-thumb);
  border: 2px solid var(--bg);
  border-radius: 999px;
}
*::-webkit-scrollbar-thumb:hover { background: var(--scrollbar-thumb-hover); }
*::-webkit-scrollbar-corner { background: transparent; }

html, body {
  background: var(--bg);
  color: var(--text);
  font-family: var(--font-primary);
  font-feature-settings: 'calt', 'kern', 'liga', 'ss03';
  letter-spacing: 0.2px;
  font-weight: 400;
  line-height: 1.65;
  font-size: 16px;
  -webkit-font-smoothing: antialiased;
}

a { color: var(--accent); text-decoration: none; }
code, pre { font-family: var(--font-mono); }

/* Page width */
.container {
  max-width: 760px;
  margin: 0 auto;
  padding: 80px 32px 160px;
}

/* Topbar (back link) */
.topbar {
  position: absolute;
  top: 24px;
  left: 32px;
}
.back-link {
  font-size: 13px;
  color: var(--text-faint);
  border-bottom: 1px solid transparent;
}
.back-link:hover { color: var(--text-dim); }

/* HERO */
.hero { margin-bottom: 56px; }
.eyebrow {
  color: var(--accent);
  font-size: 12px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 1.4px;
  margin-bottom: 16px;
}
h1 {
  font-size: 44px;
  font-weight: 600;
  line-height: 1.15;
  letter-spacing: -0.5px;
  margin-bottom: 20px;
}
h2 {
  font-size: 26px;
  font-weight: 600;
  line-height: 1.25;
  letter-spacing: -0.2px;
  margin-bottom: 16px;
}
h3 {
  font-size: 18px;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 12px;
}
h4 {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
  margin-bottom: 10px;
}
.learning-promise,
.promise {
  font-size: 19px;
  color: var(--text-dim);
  line-height: 1.55;
  margin-bottom: 28px;
  max-width: 640px;
}
.prereqs {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  list-style: none;
  padding: 0;
}
.prereqs li,
.chip {
  display: inline-flex;
  align-items: center;
  padding: 6px 12px;
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 86px;
  font-size: 12px;
  color: var(--text-dim);
  font-weight: 500;
}
.prereqs li::before,
.chip::before {
  content: '';
  width: 5px;
  height: 5px;
  background: var(--text-faint);
  border-radius: 50%;
  margin-right: 8px;
}

/* Badges */
.badges { display: flex; gap: 8px; }
.badge {
  font-size: 12px;
  font-weight: 600;
  color: var(--text);
  background: var(--surface-2);
  padding: 3px 10px;
  border-radius: 6px;
  border: 1px solid var(--border-soft);
}

/* Footer / next */
.page-footer,
.footer {
  margin-top: 72px;
  padding-top: 32px;
  border-top: 1px solid var(--border-soft);
  color: var(--text-faint);
  font-size: 13px;
}
.page-footer { text-align: left; }
.footer { text-align: center; }
.next-link {
  display: inline-block;
  font-size: 15px;
  font-weight: 500;
  color: var(--accent);
  margin-bottom: 8px;
}
.recap {
  color: var(--text-faint);
  font-size: 13.5px;
  line-height: 1.55;
  max-width: 540px;
}

/* _index.css — index page only. Card grid + project header bits not in _base.css. */

.section { margin-bottom: 48px; }
.section-title {
  font-size: 14px;
  font-weight: 600;
  letter-spacing: 0.2px;
  color: var(--text-faint);
  text-transform: uppercase;
  margin-bottom: 16px;
}

.project-header { margin-bottom: 48px; }
.project-header h1 {
  font-size: 32px;
  font-weight: 600;
  line-height: 1.1;
  color: var(--text);
  margin-bottom: 8px;
}
.project-header p {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.6;
  color: var(--text-dim);
  letter-spacing: 0.2px;
  margin-bottom: 12px;
}

.card-grid {
  display: grid;
  grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

.card {
  background: var(--surface);
  border: 1px solid var(--border);
  border-radius: 12px;
  padding: 20px;
  text-decoration: none;
  display: block;
  transition: opacity 0.2s, border-color 0.2s, transform 0.2s;
  box-shadow: var(--shadow-card);
}
.card:hover {
  opacity: 0.95;
  border-color: rgba(255,255,255,0.12);
  transform: translateY(-1px);
}
.card-type {
  font-size: 11px;
  font-weight: 600;
  color: var(--accent);
  background: var(--accent-soft);
  padding: 2px 8px;
  border-radius: 4px;
  display: inline-block;
  margin-bottom: 10px;
  font-family: var(--font-mono);
  letter-spacing: 0.3px;
}
.card-title,
.card h3 {
  font-size: 16px;
  font-weight: 500;
  line-height: 1.3;
  color: var(--text);
  margin-bottom: 6px;
}
.card-description,
.card p {
  font-size: 13px;
  font-weight: 500;
  line-height: 1.5;
  color: var(--text-dim);
  letter-spacing: 0.2px;
}
.card-meta {
  font-size: 11px;
  font-weight: 600;
  color: var(--text-faint);
  margin-top: 10px;
  font-family: var(--font-mono);
}

</style>
</head>
<body>
<main class="container">
  <div class="project-header">
    <h1>OhMyC</h1>
    <p>A CLI tool and React dashboard for tracking Claude Code / OpenCode usage statistics.</p>
    <div class="badges">
      <span class="badge">TypeScript</span>
      <span class="badge">React + Fastify</span>
    </div>
  </div>

  <div class="section">
    <div class="section-title">Perspectives</div>
    <div class="card-grid" id="perspectives-grid"></div>
  </div>

  <div class="section">
    <div class="section-title">Module Deep Dives</div>
    <div class="card-grid" id="modules-grid"></div>
  </div>
</main>

<script>
/* _runtime.js — shared runtime helpers for essay AND index pages.
   Mermaid init, render helper, markdown link parser, escape, line-highlighted code renderer. */

if (typeof mermaid !== 'undefined') {
  mermaid.initialize({
    startOnLoad: false,
    theme: 'base',
    themeVariables: {
      background: '#101111',
      primaryColor: '#161718',
      primaryTextColor: '#f9f9f9',
      primaryBorderColor: '#252829',
      lineColor: '#9c9c9d',
      secondaryColor: '#FF6363',
      tertiaryColor: '#0c0d0f',
      fontFamily: 'Inter, sans-serif',
    },
    flowchart: { curve: 'basis', padding: 20 },
  });
}

async function renderMermaid(selector) {
  if (typeof mermaid === 'undefined') return;
  const nodes = document.querySelectorAll(selector);
  for (const node of nodes) {
    const src = node.textContent.trim();
    if (!src) continue;
    const id = 'm' + Math.random().toString(36).slice(2);
    const { svg } = await mermaid.render(id, src);
    node.innerHTML = svg;
  }
}

function escapeHtml(s) {
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;');
}

function renderMarkdownLinks(text) {
  // Minimal markdown: [label](href) -> <a href="href">label</a>.
  // Caller is responsible for escaping non-link content if needed.
  return String(text).replace(/\[([^\]]+)\]\(([^)]+)\)/g, (_, label, href) =>
    `<a href="${escapeHtml(href)}">${escapeHtml(label)}</a>`);
}

function normalizeCodeSnippet(code) {
  return String(code)
    .replace(/\r\n?/g, '\n')
    .split('\n')
    .reduce((acc, line) => {
      const blank = line.trim() === '';
      if (blank && (acc.length === 0 || acc[acc.length - 1].trim() === '')) return acc;
      acc.push(line);
      return acc;
    }, [])
    .filter((line, index, lines) => {
      const blank = line.trim() === '';
      return !blank || (index > 0 && index < lines.length - 1);
    })
    .join('\n');
}

function renderCodeLine(line, number, className) {
  const safe = escapeHtml(line);
  return `<span class="${className}" data-line="${number}"><span class="ln">${number}</span><span class="code-text">${safe || ' '}</span></span>`;
}

function renderCode(code, highlightLines = []) {
  const lines = normalizeCodeSnippet(code).split('\n');
  const set = new Set(highlightLines);
  const body = lines.map((line, i) => {
    const n = i + 1;
    const cls = set.has(n) && line.trim() !== '' ? 'line line-hl' : 'line';
    return renderCodeLine(line, n, cls);
  }).join('');
  return `<pre class="code-block">${body}</pre>`;
}

/* _index.js — index page runtime.
   renderIndex(INDEX) builds the perspective + module card grids. */

function renderIndex(index) {
  const pGrid = document.getElementById('perspectives-grid');
  const mGrid = document.getElementById('modules-grid');
  if (!index) return;

  if (pGrid && Array.isArray(index.perspectives)) {
    pGrid.innerHTML = index.perspectives.map((p) => `
      <a class="card" href="${escapeHtml(p.page)}">
        <span class="card-type">${escapeHtml(p.diagramType || 'perspective')}</span>
        <h3 class="card-title">${escapeHtml(p.title)}</h3>
        <p class="card-description">${escapeHtml(p.description || '')}</p>
        ${typeof p.unitCount === 'number' ? `<div class="card-meta">${p.unitCount} unit${p.unitCount !== 1 ? 's' : ''}</div>` : ''}
      </a>
    `).join('');
  }

  if (mGrid && Array.isArray(index.modules)) {
    mGrid.innerHTML = index.modules.map((m) => `
      <a class="card" href="${escapeHtml(m.page)}">
        <span class="card-type">module</span>
        <h3 class="card-title">${escapeHtml(m.title)}</h3>
        <p class="card-description">${escapeHtml(m.description || '')}</p>
        ${typeof m.unitCount === 'number' ? `<div class="card-meta">${m.unitCount} unit${m.unitCount !== 1 ? 's' : ''}</div>` : ''}
      </a>
    `).join('');
  }
}


const INDEX = {
  "project": {
    "name": "OhMyC",
    "description": "A CLI tool and React dashboard for tracking Claude Code / OpenCode usage statistics.",
    "language": "TypeScript",
    "framework": "React + Fastify"
  },
  "perspectives": [
    {
      "title": "Architecture",
      "description": "How the monorepo splits into CLI, server, timeline library, UI, and plugin layers.",
      "page": "architecture.html",
      "diagramType": "architecture",
      "unitCount": 6
    },
    {
      "title": "Data Flow",
      "description": "The journey of a session from OpenCode event to rendered heatmap cell.",
      "page": "data-flow.html",
      "diagramType": "data-flow",
      "unitCount": 5
    },
    {
      "title": "Data Model",
      "description": "SQLite schema, relationships, and why the table shape matches the query patterns.",
      "page": "data-model.html",
      "diagramType": "data-model",
      "unitCount": 5
    },
    {
      "title": "Plugin Lifecycle",
      "description": "How the OpenCode plugin captures session events and writes them to SQLite.",
      "page": "plugin-lifecycle.html",
      "diagramType": "lifecycle",
      "unitCount": 5
    }
  ],
  "modules": [
    {
      "title": "CLI Entry",
      "description": "The cac-based CLI that launches the server and manages dashboard commands.",
      "page": "module-cli-entry.html",
      "unitCount": 5
    },
    {
      "title": "Server",
      "description": "Fastify server with static file serving and REST API routes for agents, skills, and timeline.",
      "page": "module-server.html",
      "unitCount": 5
    },
    {
      "title": "Timeline DB",
      "description": "SQLite connection, WAL mode, and schema migrations with better-sqlite3.",
      "page": "module-timeline-db.html",
      "unitCount": 5
    },
    {
      "title": "Timeline Writer",
      "description": "Prepared statements and transactional upserts for session, tool, and skill data.",
      "page": "module-timeline-writer.html",
      "unitCount": 5
    },
    {
      "title": "Timeline Query",
      "description": "Heatmap aggregation, paginated events, and session detail lookups.",
      "page": "module-timeline-query.html",
      "unitCount": 5
    },
    {
      "title": "UI App",
      "description": "React router, command palette, and the timeline view with heatmap + event list.",
      "page": "module-ui-app.html",
      "unitCount": 5
    },
    {
      "title": "Shared Schemas",
      "description": "Zod schemas that type-check settings, agents, skills, and commands across packages.",
      "page": "module-shared.html",
      "unitCount": 5
    },
    {
      "title": "OpenCode Plugin",
      "description": "Event hooks that accumulate session stats and flush to SQLite on idle.",
      "page": "module-plugin.html",
      "unitCount": 5
    }
  ]
};
renderIndex(INDEX);
</script>
</body>
</html>

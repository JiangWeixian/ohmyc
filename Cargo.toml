[workspace]
resolver = "2"
members = [
  "crates/ohmyc-core",
  "packages/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
authors = ["JiangWeixian"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
# preserve_order: we rewrite config files we do not own (opencode.json,
# settings.json). Without it serde_json's Map is a BTreeMap and every write
# alphabetises the user's keys, turning a one-line change into a whole-file diff.
serde_json = { version = "1", features = ["preserve_order"] }
thiserror = "1"
dirs = "5"
tempfile = "3"
rstest = "0.21"

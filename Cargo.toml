[workspace]
resolver = "2"
members = [
  "crates/ohmyc-core",
  "packages/desktop/src-tauri",
]

[workspace.package]
edition = "2021"
authors = ["JiangWeixian"]
license = "MIT"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
dirs = "5"
tempfile = "3"
rstest = "0.21"

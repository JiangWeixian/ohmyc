[package]
name = "ohmyc-desktop"
version = "0.1.0"
description = "OhMyC menu bar app"
authors.workspace = true
edition.workspace = true

[lib]
name = "ohmyc_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = ["tray-icon", "macos-private-api"] }
serde = { workspace = true }
serde_json = { workspace = true }
ohmyc-core = { path = "../../../crates/ohmyc-core" }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
notify = "6"
notify-debouncer-mini = "0.4"

[target."cfg(target_os = \"macos\")".dependencies]
window-vibrancy = "0.5"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "block2", "objc2-core-foundation", "NSImage", "NSFont", "NSFontDescriptor", "NSColor", "NSAttributedString", "NSStringDrawing", "NSStatusItem", "NSButton", "NSView", "NSControl", "NSResponder", "NSCell", "NSAccessibilityProtocols"] }
block2 = "0.6"

[dev-dependencies]
chrono-tz = "0.10"
tauri = { version = "~2.11", features = ["test"] }
tempfile = { workspace = true }

[target."cfg(target_os = \"macos\")".dev-dependencies]
tray-icon = { version = "=0.23.1", default-features = false }

[[test]]
name = "tray_hit_area"
harness = false
